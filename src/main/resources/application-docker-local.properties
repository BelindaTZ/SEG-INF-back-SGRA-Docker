# Perfil opcional para recibir los secretos al ejecutar el contenedor.
spring.cloud.azure.keyvault.secret.property-source-enabled=false
spring.datasource.url=${SGRA_DB_URL}
spring.datasource.username=${SGRA_DB_USERNAME}
spring.datasource.password=${SGRA_DB_PASSWORD}
sgra-master-key=${SGRA_MASTER_KEY}
spring-cloud-azure-storage-blob-connection-string=${SGRA_BLOB_CONNECTION_STRING}
groq.api.key=${SGRA_GROQ_API_KEY}
backup.db-username=${SGRA_BACKUP_DB_USERNAME}
backup.db-password=${SGRA_BACKUP_DB_PASSWORD}
sgra.emergency.password=${SGRA_EMERGENCY_PASSWORD}
